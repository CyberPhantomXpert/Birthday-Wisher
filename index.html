<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🥳</title>

  <meta name="description" content="A little birthday surprise, made just for you.">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Happy Birthday 🥳">
  <meta property="og:description" content="A little birthday surprise, made just for you.">
  <meta property="og:image" content="banner.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.ico" sizes="any">

  <!-- Fonts (https, with a swap fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@1,300&family=Signika:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles: our own layout layer replaces Bootstrap; cake.css is the compiled cake.less -->
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="stylesheet" href="loading.css">
  <link rel="stylesheet" href="css/cake.css">
</head>

<body>
  <div class="loading"></div>
  <canvas id="canvas" aria-hidden="true"></canvas>

  <audio class="song" id="song" loop preload="auto">
    <source src="hbd.mp3" type="audio/mpeg">
    Your browser does not support audio playback.
  </audio>

  <!-- Balloons are generated from config.js -->
  <div id="balloon-stage"></div>

  <img src="Balloon-Border.png" width="100%" class="balloon-border" alt="">

  <div class="container">

    <div class="row">
      <div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_yellow"></div></div>
      <div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_red"></div></div>
      <div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_blue"></div></div>
      <div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_green"></div></div>
      <div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_pink"></div></div>
      <div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_orange"></div></div>
    </div>

    <div class="row">
      <div class="col-md-12 text-center">
        <img src="banner.png" class="bannar" alt="Happy Birthday">
      </div>
    </div>

    <div class="row cake-cover">
      <div class="col-md-12 text-center">
        <div class="cake">
          <div class="velas">
            <div class="fuego"></div>
            <div class="fuego"></div>
            <div class="fuego"></div>
            <div class="fuego"></div>
            <div class="fuego"></div>
          </div>
          <div class="cobertura"></div>
          <div class="bizcocho"></div>
        </div>
      </div>
    </div>

    <div class="row message">
      <div class="col-md-12 message-body"><!-- filled from config.js by main.js --></div>
    </div>

    <div class="navbar-fixed-bottom control-panel">
      <div class="row">
        <div class="col-md-12 text-center">
          <button class="btn btn-primary" id="turn_on">Turn On Lights 💡</button>
          <button class="btn btn-primary" id="play">Play Music 🎵</button>
          <button class="btn btn-primary" id="bannar_coming">Let's Decorate 🎁</button>
          <button class="btn btn-primary" id="balloons_flying">Fly With Balloons 🎈</button>
          <button class="btn btn-primary" id="cake_fadein">Most Delicious Cake 🎂</button>
          <button class="btn btn-primary" id="light_candle">Light the Candle 🕯️</button>
          <button class="btn btn-primary" id="wish_message">Happy Birthday 🥳</button>
          <button class="btn btn-primary" id="story">A message ✉️ for you</button>
        </div>
      </div>
    </div>

  </div>

  <footer class="credit">Made with ❤ by <span class="js-from-name"></span></footer>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>
  <script src="js/main.js"></script>
  <script src="js/fireworks.js"></script>
</body>
</html>
